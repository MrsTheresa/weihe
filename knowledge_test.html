<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卫禾守护 - 青少年法治意识测评</title>
  <style>
    /* --- 卫禾守护 全新视觉变量 --- */
    :root {
      /* 核心色板：成长绿 + 守护蓝 */
      --primary-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      --brand-color: #2dce89;
      --accent-purple: #7474bf;
      --bg-gradient: radial-gradient(circle at top right, #e0c3fc 0%, #8ec5fc 100%);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.4);
      --text-main: #1a3a3a;
      --text-muted: #525f7f;
      --shadow-sm: 0 4px 6px rgba(50, 50, 93, 0.11);
      --shadow-lg: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      background: #f6f9fc;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* --- 背景动态高斯模糊光晕 --- */
    .bg-blobs {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
      background: #f0f4f8;
    }
    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: var(--primary-gradient);
      filter: blur(80px);
      border-radius: 50%;
      opacity: 0.15;
      animation: move 20s infinite alternate;
    }
    .blob-1 { top: -10%; right: -10%; background: #8ec5fc; }
    .blob-2 { bottom: -10%; left: -10%; background: #43e97b; animation-delay: -5s; }

    @keyframes move {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(100px, 50px) scale(1.1); }
    }

    /* --- 布局容器 --- */
    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
    }

    /* --- 头部设计 --- */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-logo {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--brand-color);
      letter-spacing: 2px;
      margin-bottom: 10px;
      display: block;
      text-transform: uppercase;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 10px 0;
      background: linear-gradient(to right, #2dce89, #2d98ce);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    header .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    /* --- 状态栏 (玻璃拟态效果) --- */
    .status-sticky-wrapper {
      position: sticky;
      top: 20px;
      z-index: 100;
      margin-bottom: 30px;
    }

    .status-bar {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 20px 30px;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-display {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .timer-display i { color: var(--brand-color); }
    .timer-warn { color: #f5365c !important; animation: shake 0.5s infinite; }

    .progress-container { flex: 1; margin-left: 40px; }
    .progress-text { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-align: right;}

    .progress-bar-bg {
      height: 10px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary-gradient);
      width: 0%;
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* --- 题目卡片 --- */
    .question {
      background: white;
      padding: 35px;
      margin-bottom: 25px;
      border-radius: 30px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.02);
      transition: all 0.3s ease;
    }

    .question:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .question h3 {
      font-size: 1.25rem;
      margin-bottom: 25px;
      display: flex;
      align-items: flex-start;
    }
    
    .q-number {
      background: var(--primary-gradient);
      color: white;
      min-width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(45, 206, 137, 0.3);
    }

    /* --- 选项交互优化 --- */
    .option {
      display: flex;
      align-items: center;
      background: #f8fafc;
      padding: 18px 25px;
      margin-bottom: 15px;
      border-radius: 18px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option:hover {
      background: #f1f5f9;
      transform: scale(1.01);
    }

    .option input[type="radio"] { display: none; }

    .checkmark {
      width: 24px;
      height: 24px;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      margin-right: 15px;
      position: relative;
      transition: all 0.2s;
      background: white;
    }

    .option input:checked ~ .checkmark {
      background: var(--brand-color);
      border-color: var(--brand-color);
      box-shadow: 0 4px 10px rgba(45, 206, 137, 0.4);
    }

    .option input:checked ~ .checkmark::after {
      content: '✓';
      color: white;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      font-weight: bold;
    }

    .option.selected-active {
      border-color: var(--brand-color);
      background: rgba(45, 206, 137, 0.05);
    }

    /* --- 按钮设计 --- */
    .btn-row { display: flex; gap: 20px; margin: 40px 0; }

    button {
      flex: 1;
      padding: 18px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: var(--brand-color);
      color: white;
      box-shadow: 0 7px 14px rgba(45, 206, 137, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(45, 206, 137, 0.3);
      filter: brightness(1.1);
    }

    .btn-secondary {
      background: white;
      color: var(--text-muted);
      border: 1px solid #e2e8f0;
    }

    /* --- 结果弹窗 (强玻璃拟态) --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 30, 50, 0.4);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0; visibility: hidden;
      transition: 0.4s;
    }

    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal-content {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      width: 90%;
      max-width: 500px;
      padding: 50px 40px;
      border-radius: 40px;
      text-align: center;
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      transform: translateY(30px);
      transition: 0.4s;
    }

    .modal-overlay.open .modal-content { transform: translateY(0); }

    .result-score {
      font-size: 4rem;
      font-weight: 900;
      margin: 10px 0;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* --- 动画提示 --- */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    #toast {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translate(-50%, -100px);
      background: #172b4d;
      color: white;
      padding: 15px 30px;
      border-radius: 50px;
      transition: 0.5s cubic-bezier(0.68, -0.55, 0.26, 1.55);
      z-index: 2000;
      font-weight: 500;
    }
    #toast.show { transform: translate(-50%, 0); }

    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      .status-bar { padding: 15px; }
      .progress-container { display: none; }
      .btn-row { flex-direction: column; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

  <!-- 背景装饰光晕 -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="container">
    <header>
      <span class="brand-logo">卫禾守护 · WEIHE GUARDIAN</span>
      <h1>卫禾法治课堂</h1>
      <p class="subtitle">让法治的种子在青少年心中生根发芽</p>
    </header>

    <div class="status-sticky-wrapper">
      <div class="status-bar">
        <div class="timer-display" id="timer">
          <i class="fas fa-stopwatch"></i> <span id="time-left">15:00</span>
        </div>
        <div class="progress-container">
          <div class="progress-text" id="progress-text">已完成 0 / 20</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <form id="quizForm"></form>

    <div class="btn-row">
      <button type="button" class="btn-secondary" id="backBtn">
        <i class="fas fa-home"></i> 退出测评
      </button>
      <button type="button" class="btn-primary" id="submitBtn">
        <i class="fas fa-check-circle"></i> 提交测评
      </button>
    </div>
  </div>

  <!-- 结果弹窗 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div id="result-icon" style="font-size: 5rem; margin-bottom: 20px;">🌱</div>
      <div class="result-score" id="result-score">0分</div>
      <h2 id="result-eval" style="margin-bottom: 15px;">继续加油！</h2>
      <div id="result-details" style="text-align: left; background: rgba(0,0,0,0.03); padding: 20px; border-radius: 20px; margin-bottom: 12px; font-size: 0.9rem; color: var(--text-muted); min-height: 48px;"></div>
      <button type="button" class="btn-secondary" id="explainBtn" style="width: 100%; margin-bottom: 10px;">🔍 查看知识点讲解</button>
      <div id="explanation-panel" style="display: none; text-align:left; background: rgba(255,255,255,0.95); border-radius: 16px; padding: 14px; color: #1f467a; line-height: 1.5; max-height: 240px; overflow-y: auto; border: 1px solid rgba(45,206,137,0.22); margin-bottom: 10px;"></div>
      <button class="btn-primary" style="width: 100%;" onclick="location.reload()">
        <i class="fas fa-redo"></i> 开启新挑战
      </button>
    </div>
  </div>
  
  <div id="toast">请先完成所有题目再提交哦！</div>

  <script>
    // 数据保持一致，但逻辑中增加了交互反馈
    const quizData = [
      { q: "我国的根本大法是：", a: "B", os: ["中华人民共和国刑法", "中华人民共和国宪法", "中华人民共和国民法典", "中华人民共和国未成年人保护法"],
        exp: "宪法是国家的根本法，具有最高法律效力，是全体人民共同遵循的总章程。" },
      { q: "中国社会主义法治的核心价值追求是：", a: "C", os: ["严格执法", "全民守法", "公平正义", "服务大局"],
        exp: "社会主义法治核心是实现社会公平正义，保障人民权利和国家法治秩序。" },
      { q: "全面推进依法治国的总目标是：", a: "A", os: ["建设中国社会主义法治体系，建设社会主义法治国家", "完善社会主义法律体系", "深化行政执法体制改革", "实现国家治理体系和治理能力现代化"],
        exp: "这是《依法治国》总目标明确提出的三大建设目标之一，体现了法治国家的整体要求。" },
      { q: "我国宪法规定，宪法的修改由全国人民代表大会以全体代表的____以上的多数通过。", a: "D", os: ["二分之一", "四分之三", "五分之四", "三分之二"] },
      { q: "下列哪项不属于我国公民的基本义务？", a: "C", os: ["维护国家统一和民族团结", "依法纳税", "出国旅游", "依法服兵役"] },
      { q: "“法立于上，教弘于下。”这句话强调的是：", a: "B", os: ["立法的重要性", "学法普法的重要性", "严格执法的重要性", "司法公正的重要性"] },
      { q: "国家宪法日是每年的：", a: "B", os: ["10月1日", "12月4日", "3月15日", "5月4日"] },
      { q: "在我国，国家的一切权力属于____。", a: "A", os: ["人民", "中国共产党", "国务院", "全国人民代表大会"] },
      { q: "新中国成立以来第一部以“典”命名的法律是：", a: "C", os: ["中华人民共和国未成年人保护法", "中华人民共和国刑法", "中华人民共和国民法典", "中华人民共和国网络安全法"] },
      { q: "根据《未成年人保护法》，新修订的版本确立了“六位一体”的未成年人保护工作新格局，其中排在第一位的是：", a: "B", os: ["学校保护", "家庭保护", "社会保护", "网络保护"] },
      { q: "在法律面前人人平等，这主要体现了法治的____原则。", a: "A", os: ["平等", "公正", "民主", "科学"] },
      { q: "我国依法治国的执政党是：", a: "B", os: ["各民主党派", "中国共产党", "人民政协", "全国人大代表"] },
      { q: "作为青少年，当我们遇到校园欺凌时，正确的做法是：", a: "D", os: ["忍气吞声，自认倒霉", "找人报复，以暴制暴", "不关自己的事，假装没看见", "及时告诉老师或家长，依法维权"] },
      { q: "中华人民共和国国旗是五星红旗，其中大五角星代表____。", a: "A", os: ["中国共产党", "中国人民", "工人阶级", "农民阶级"] },
      { q: "在公共场所乱扔垃圾、随地吐痰，主要违反了____。", a: "B", os: ["刑法", "治安管理处罚法/社会公德", "未成年人保护法", "劳动法"] },
      { q: "“法律如果推不开，就要把它压进去。”这句名言强调了法律的____。", a: "C", os: ["指引作用", "预测作用", "强制作用", "教育作用"] },
      { q: "未成年人是指未满____周岁的公民。", a: "B", os: ["16", "18", "14", "20"] },
      { q: "专门用来保护未成年人健康成长的法律是：", a: "A", os: ["中华人民共和国未成年人保护法", "中华人民共和国义务教育法", "中华人民共和国预防未成年人犯罪法", "以上都是"] },
      { q: "互联网不是法外之地。在网上散布谣言、侮辱他人，需要承担____法律责任。", a: "D", os: ["民事责任", "行政责任", "刑事责任", "根据情节，可能承担上述一种或多种"] },
      { q: "树立法治意识，我们要做到：", a: "D", os: ["不仅要守法，还要懂得用法律维护合法权益", "自觉尊法学法守法用法", "反对特权思想和特权现象", "以上都是"] }
    ];

    const explanations = [
      "宪法是国家的根本法，具有最高法律效力，是全体人民共同遵循的总章程。",
      "社会主义法治核心是实现社会公平正义，保障人民权利和国家法治秩序。",
      "这是依法治国总目标之一，强调建设社会主义法治体系和国家。",
      "宪法修改由全国人大以全体代表的三分之二以上多数通过。",
      "出国旅游不属于公民法律义务。",
      "该题考察学法普法的重要性。",
      "国家宪法日是12月4日。",
      "国家的一切权力属于人民。",
      "第一部以“典”命名的法律是民法典。",
      "未成年人保护工作第一位是家庭保护。",
      "法律面前人人平等体现了平等原则。",
      "依法治国的执政党是中国共产党。",
      "遇到校园欺凌要及时告诉老师或家长，依法维权。",
      "五星红旗大五角星代表中国共产党。",
      "随地乱扔垃圾主要违反的是治安管理处罚法/社会公德。",
      "“法律如果推不开，就要把它压进去”强调法律的强制作用。",
      "未成年人是指未满18周岁的公民。",
      "专门保护未成年人的法律是《未成年人保护法》。",
      "网络违法行为根据情节可能承担行政、民事、刑事责任。",
      "树立法治意识要做到学法、守法、用法律维护权益。"
    ];
    let timeLeft = 15 * 60;
    let timerInterval = null;
    const totalQuestions = quizData.length;

    const quizForm = document.getElementById('quizForm');
    const timerText = document.getElementById('time-left');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressText = document.getElementById('progress-text');
    const submitBtn = document.getElementById('submitBtn');
    const modal = document.getElementById('modal-overlay');
    const toast = document.getElementById('toast');

    function initQuiz() {
      renderQuestions();
      startTimer();
    }

    function renderQuestions() {
      quizData.forEach((data, index) => {
        const qNum = index + 1;
        const qEl = document.createElement('div');
        qEl.className = 'question';
        qEl.dataset.answer = data.a;

        const optionsHtml = data.os.map((option, i) => {
          const letter = String.fromCharCode(65 + i);
          return `
            <label class="option" for="q${qNum}${letter}">
              <input type="radio" name="q${qNum}" value="${letter}" id="q${qNum}${letter}">
              <span class="checkmark"></span>
              <span class="option-text"><strong>${letter}.</strong> ${option}</span>
            </label>
          `;
        }).join('');

        qEl.innerHTML = `
          <h3><span class="q-number">${qNum}</span>${data.q}</h3>
          <div class="options-group">${optionsHtml}</div>
        `;
        quizForm.appendChild(qEl);
      });

      document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', function() {
          const name = this.querySelector('input').name;
          document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
            input.closest('.option').classList.remove('selected-active');
          });
          this.classList.add('selected-active');
          updateStatus();
        });
      });
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        timerText.textContent = `${mins}:${secs}`;
        if (timeLeft <= 60) timerText.classList.add('timer-warn');
        if (timeLeft <= 0) { clearInterval(timerInterval); autoSubmit(); }
      }, 1000);
    }

    function updateStatus() {
      const answered = document.querySelectorAll('input[type="radio"]:checked').length;
      progressText.textContent = `已完成 ${answered} / ${totalQuestions}`;
      progressBarFill.style.width = `${(answered / totalQuestions) * 100}%`;
    }

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = './training.html';
    });

    submitBtn.addEventListener('click', () => {
      const answered = document.querySelectorAll('input[type="radio"]:checked').length;
      if (answered < totalQuestions) {
        showToast();
        return;
      }
      showResult();
    });

    function showResult() {
      clearInterval(timerInterval);
      let score = 0;
      let mistakes = [];
      quizData.forEach((d, i) => {
        const selected = document.querySelector(`input[name="q${i+1}"]:checked`)?.value;
        if (selected === d.a) score += 5;
        else mistakes.push(i + 1);
      });

      document.getElementById('result-score').textContent = `${score}分`;
      const evalEl = document.getElementById('result-eval');
      const iconEl = document.getElementById('result-icon');
      
      if(score >= 90) { evalEl.textContent = "法治小先锋！"; iconEl.textContent = "🏆"; }
      else if(score >= 60) { evalEl.textContent = "很棒，继续努力！"; iconEl.textContent = "🍀"; }
      else { evalEl.textContent = "要加强学法哦！"; iconEl.textContent = "📖"; }

      if (mistakes.length === 0) {
        document.getElementById('result-details').innerHTML = "恭喜！你已经完全掌握了本次测评的所有法治知识！ 点击“查看知识点讲解”巩固理解。";
      } else {
        const explanationItems = mistakes.map(i => {
          return `<p><strong>第 ${i} 题：</strong>${explanations[i-1]}</p>`;
        }).join('');

        document.getElementById('result-details').innerHTML = `你答错了第 ${mistakes.join(', ')} 题。<br/>` +
          `请点击“查看知识点讲解”了解详细解析。`;

        document.getElementById('explanation-panel').innerHTML = `<div style="font-weight:700; color:#2a6bc3; margin-bottom:8px;">错题解析（${mistakes.join(', ')}）</div>${explanationItems}`;
      }

      modal.classList.add('open');
      // 默认展开解释面板
      document.getElementById('explanation-panel').style.display = 'block';
      document.getElementById('explainBtn').textContent = '隐藏知识点讲解';
    }

    document.getElementById('explainBtn').addEventListener('click', () => {
      const panel = document.getElementById('explanation-panel');
      if (panel.style.display === 'none' || !panel.style.display) {
        panel.style.display = 'block';
        document.getElementById('explainBtn').textContent = '隐藏知识点讲解';
      } else {
        panel.style.display = 'none';
        document.getElementById('explainBtn').textContent = '🔍 查看知识点讲解';
      }
    });

    window.onload = initQuiz;
  </script>
</body>
</html>
