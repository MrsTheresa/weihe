<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卫禾守护 乡村未成年人多源风险感知与智能预警平台 - 用户登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/a2f62b56a4.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --brand: #1e9cff;
      --accent: #17d4d0;
      --dark: #0c1d3d;
      --soft: #edf6ff;
      --radius: 18px;
      --shadow-light: 0 12px 30px rgba(15, 33, 75, 0.14);
      --shadow-strong: 0 18px 38px rgba(8, 22, 50, 0.26);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", "Source Sans Pro", sans-serif;
      background: radial-gradient(circle at 20% 20%, #f2fbff 0%, #e7f7ff 52%, #eff8ff 100%);
      color: var(--dark);
    }
    .app-shell { display: grid; min-height: 100vh; }
    .login-layout { margin: auto; width: min(1040px, 95vw); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-strong); backdrop-filter: blur(6px); }
    .hero-wrap { display: grid; grid-template-columns: 1.1fr 1fr; min-height: 610px; }
    .hero-panel {
      position: relative;
      background: url("https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200") center/cover no-repeat;
      filter: saturate(1.15) brightness(0.93);
    }
    .hero-panel::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(170deg, rgba(22, 34, 86, 0.52), rgba(2, 170, 170, 0.3));
    }
    .hero-panel .info {
      position: absolute; bottom: 32px; left: 28px; color: #fff;
      z-index: 1; max-width: 300px; padding: 24px; border-radius: 14px;
      background: rgba(4, 17, 46, 0.5); backdrop-filter: blur(6px);
      box-shadow: var(--shadow-light);
    }
    .hero-panel h1 { margin: 0 0 0.7rem; font-size: clamp(1.5rem, 2.3vw, 2.2rem); letter-spacing: 0.3px; }
    .hero-panel h1 span { display: block; }
    .hero-panel h1 .platform-name { margin-top: 0.3rem; font-size: 1rem; line-height: 1.5; letter-spacing: 0; }
    .hero-panel p { margin: 0; color: #dbecff; line-height: 1.5; }
    .form-panel { background: rgba(255, 255, 255, 0.95); padding: 44px 38px; display: flex; flex-direction: column; justify-content: center; }
    .form-panel h2 { margin: 0; font-size: 2rem; color: var(--brand); }
    .form-panel p { margin: 8px 0 20px; color: #567199; font-size: 0.94rem; }
    .user-switch { display: inline-flex; gap: 0.65rem; margin-bottom: 20px; }
    .user-switch button {
      border: 1px solid #dce9ff; background: #f5fbff; color: #3067a1;
      border-radius: 999px; padding: 0.54rem 0.95rem; font-weight: 600;
      transition: all .23s ease;
    }
    .user-switch button.active {
      border-color: var(--brand); background: linear-gradient(92deg, #e8f5ff, #f4fbff);
      color: var(--dark); box-shadow: 0 10px 22px rgba(33, 104, 196, 0.2);
    }
    .form-field { display: grid; gap: 7px; margin-bottom: 14px; }
    .form-field label { font-size: .88rem; font-weight: 700; color: #2a4f7d; }
    .form-field .input-wrap { position: relative; }
    .form-field input {
      width: 100%; border: 1px solid #dbe8f9; border-radius: 14px;
      padding: 12px 14px 12px 42px; font-size: 0.96rem;
      background: #fff; color: #16345b;
      box-shadow: inset 0 2px 8px rgba(7, 30, 72, .05);
      transition: border .2s ease, box-shadow .2s ease;
    }
    .form-field input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(40, 144, 238, .17); }
    .form-field .input-wrap i { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); color: #7f95b3; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 19px; font-size: .88rem; }
    .actions label { cursor: pointer; color: #2c4e7c; }
    .actions input { margin-right: 6px; accent-color: var(--brand); }
    .actions a { color: var(--brand); text-decoration: none; font-weight: 600; }
    .actions a:hover { text-decoration: underline; }
    .login-btn {
      position: relative; border: none; border-radius: 16px; height: 54px;
      min-width: 168px; padding: 0 26px;
      background: linear-gradient(108deg, #1f92ff 0%, #10cfcc 100%);
      color: #fff; font-size: 1.05rem; font-weight: 800; line-height: 1;
      cursor: pointer; transition: transform .2s ease, box-shadow .32s ease, filter .32s ease;
      box-shadow: 0 16px 32px rgba(11, 121, 213, .4);
      overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center;
      text-align: center;
    }
    .login-btn .btn-icon {
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; display: flex; justify-content: center; align-items: center;
    }
    .login-btn .btn-icon i { font-size: 18px; }
    .login-btn .btn-text {
      display: inline-flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .login-btn::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.45), transparent 45%);
      opacity: 0; transition: opacity .28s ease;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 34px rgba(11, 121, 213, .44);
    }
    .login-btn:hover::after { opacity: 1; }
    .login-btn:active { transform: translateY(1px); box-shadow: 0 10px 18px rgba(18, 90, 161, .35); }
    .extra { margin-top: 14px; font-size: .86rem; color: #5572a5; }
    .extra a { color: #1c7bff; font-weight: 600; }
    .extra a:hover { text-decoration: underline; }
    footer { margin-top: 21px; color: #7b8eac; font-size: .84rem; text-align: center; }

    @media (max-width: 930px) { .hero-wrap { grid-template-columns: 1fr; min-height: auto; } .hero-panel { min-height: 230px; } .form-panel { padding: 32px 24px; } }
    @media (max-width: 560px) { .login-layout { width: calc(100vw - 24px); } .form-panel h2 { font-size: 1.5rem; } .login-btn { width: 100%; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <section class="login-layout">
      <div class="hero-wrap">
        <aside class="hero-panel" aria-hidden="true">
          <div class="info">
            <h1><span>卫禾守护</span><span class="platform-name">乡村未成年人多源风险感知与智能预警平台</span></h1>
            <p>留下守护，不留下担忧。点击登录，启动青少年安全教育与家长互联管理。</p>
          </div>
        </aside>
        <article class="form-panel" aria-labelledby="signin-title">
          <h2 id="signin-title">用户登录</h2>
          <p>支持青少年与家长/监护人身份登录</p>
          <div class="user-switch" role="tablist" aria-label="切换用户身份">
            <button type="button" class="active" role="tab" aria-selected="true">青少年</button>
            <button type="button" role="tab" aria-selected="false">家长陪伴</button>
          </div>
          <form id="loginForm" novalidate>
            <div class="form-field">
              <label for="account">账号（手机号 / 学号）</label>
              <div class="input-wrap"><i class="fas fa-user"></i><input id="account" name="account" type="text" placeholder="请输入账号" required autofocus></div>
            </div>
            <div class="form-field">
              <label for="password">密码</label>
              <div class="input-wrap"><i class="fas fa-lock"></i><input id="password" name="password" type="password" placeholder="请输入密码" required></div>
            </div>
            <div class="actions">
              <label><input type="checkbox" checked> 记住我</label>
              <a href="#">忘记密码？</a>
            </div>
            <button type="submit" class="login-btn">
              <span class="btn-icon" aria-hidden="true"><i class="fas fa-sign-in-alt"></i></span>
              <span class="btn-text">登录</span>
            </button>
            <p class="extra">新用户请 <a href="#">立即注册</a>，平台将为您提供实名保护和安全审计。</p>
            <footer>© 2026 卫禾守护 乡村未成年人多源风险感知与智能预警平台 · 青少年法治与家庭协同一体化</footer>
          </form>
        </article>
      </div>
    </section>
  </div>

  <script>
    const roles = document.querySelectorAll('.user-switch button');
    roles.forEach(btn => btn.addEventListener('click', () => {
      roles.forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
      btn.classList.add('active'); btn.setAttribute('aria-selected','true');
    }));

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const account = this.account.value.trim();
      const password = this.password.value.trim();
      if (!account || !password) {
        alert('请输入完整的账号与密码');
        return;
      }
      const role = document.querySelector('.user-switch button.active').textContent.trim();
      alert(`身份：${role}\n账号：${account}\n登录成功，3秒后进入训练页面`);
      this.reset();
      setTimeout(() => {
        window.location.href = './training.html';
      }, 300);
    });
  </script>
</body>
</html>
